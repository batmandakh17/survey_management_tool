        // an earlier export holds every dial logged before it; one lacking such a dial was written after a void, or edited
        const ids = new Set(c.f.rows.map(r => r.event_id));
        const whole = same.every(x => x.f.dials.filter(d => (Date.parse(d.logged_at) || 0) <= c.f.at).every(d => ids.has(d.event_id)));
        if (earlier && whole && c.f.at <= Math.max(...same.map(x => x.f.at))) { c.paired = false; continue; }
        const near = same.slice().sort((a, b) => Math.abs(a.f.at - c.f.at) - Math.abs(b.f.at - c.f.at))[0];
        c.row.use = `differs from ${near.f.name}`;
        issue({ key: `csv_differs:${c.f.sha}`, type: 'csv_differs', severity: 'action', file: c.f.name, enumerator: e,
          detail: `The CSV's rows match no JSON export of the same name (nearest: ${near.f.name}). The JSON is used.` });
      }
      js.forEach(x => {
        if (!x.f.chain.ok) issue({ key: `chain:${x.f.sha}`, type: 'chain_broken', severity: 'action', file: x.f.name, enumerator: e,
          detail: `Integrity check failed at event ${x.f.chain.index + 1} of ${x.f.count}: ${x.f.chain.reason}. The file is imported and marked.` });
        else if (!x.f.lastOk) issue({ key: `lasthash:${x.f.sha}`, type: 'chain_broken', severity: 'action', file: x.f.name, enumerator: e,
          detail: 'The file’s last hash does not match its last event: events may have been removed at the end.' });
        const fps = fingerprintsOf(e);
        if (fps.length && x.f.genesis && !fps.includes(x.f.genesis)) issue({ key: `genesis:${x.f.sha}`, type: 'other_assignment', severity: 'info', file: x.f.name, enumerator: e,
          detail: 'The log did not start from the assignment file this manifest lists for this enumerator.' });
      });
      const lone = cs.filter(c => !c.paired);
      const cands = js.concat(lone).sort((a, b) => (b.f.at - a.f.at) || ((b.f.chain && b.f.chain.ok ? 1 : 0) - (a.f.chain && a.f.chain.ok ? 1 : 0)) || (b.f.count - a.f.count) || cmpStr(a.f.name, b.f.name));
      const latest = cands[0];
      latest.row.use = latest.f.kind === 'json' ? (latest.f.chain.ok ? 'used' : 'used, integrity check failed') : 'used, unverified';
      if (latest.f.kind === 'csv') {
        const prior = cands.slice(1).find(x => x.f.kind === 'json');
        issue({ key: `unverified:${latest.f.sha}`, type: 'unverified', severity: 'info', file: latest.f.name, enumerator: e,
          detail: `A CSV without its JSON: imported as unverified, because its hash chain cannot be checked.${prior ? ` Its dials and the actions taken with them are used; other actions and contact updates come from the earlier ${prior.f.name}.` : ' Only its dials and the actions taken with them are known: releases or requests made apart from a call, and contact updates, come only with the JSON.'}` });
      }
      cands.slice(1).forEach(x => {
        const sameTime = x.f.at === latest.f.at, ok = latest.f.kind === 'json' && latest.f.chain.ok ? ', whose integrity check passes,' : '';
        x.row.use = sameTime ? `not used: ${latest.f.name}${ok} has the same time` : `replaced by the later export, ${latest.f.name} of ${stampOf(latest.f)}`;
        issue({ key: `older:${x.f.sha}`, type: 'older_export', severity: 'info', file: x.f.name, enumerator: e,
          detail: sameTime ? `Another export of ${e} with the same time (${stampOf(x.f)}): ${latest.f.name}${ok} is used.`
            : `An earlier export of ${e} (${stampOf(x.f)}): the later ${latest.f.name} (${stampOf(latest.f)}) is used.` });
      });
      let events;
      if (latest.f.kind === 'json') {
        const byId = new Map(latest.f.events.map(ev => [ev.event_id, ev]));
        const extra = [];
        for (const x of cands.slice(1)) {
          if (x.f.kind !== 'json') continue;
          const missing = x.f.events.filter(ev => !byId.has(ev.event_id));
          if (missing.length) {
            issue({ key: `gap:${x.f.sha}`, type: 'gap', severity: 'action', file: x.f.name, enumerator: e,
              detail: `${latest.f.name} lacks ${R.plural(missing.length, 'event')} that the earlier ${x.f.name} has. Both are kept.` });
            missing.forEach(ev => { byId.set(ev.event_id, ev); extra.push(ev); eventSource.set(ev.event_id, x.f.name); });
          }
        }
        for (const x of cands.slice(1)) {
          if (x.f.kind !== 'csv') continue;
          const missing = x.f.rows.map(rowDial).filter(d => !byId.has(d.event_id));
          if (missing.length) {
            issue({ key: `gap:${x.f.sha}`, type: 'gap', severity: 'action', file: x.f.name, enumerator: e,
              detail: `${latest.f.name} lacks ${R.plural(missing.length, 'dial')} that the earlier ${x.f.name} has. Both are kept.` });
            missing.forEach(d => { byId.set(d.event_id, d); extra.push(d); eventSource.set(d.event_id, x.f.name); });
          }
        }
        // the same event in two files with different content
        for (const x of cands.slice(1)) {
          if (x.f.kind !== 'json') continue;
          for (const ev of x.f.events) {
            const mine = byId.get(ev.event_id);
            if (!mine || R.canon(R.publicPart(mine)) === R.canon(R.publicPart(ev))) continue;   // compare content: an edit leaves the stored hash unchanged
            const d = issue({ key: `event_conflict:${ev.event_id}`, type: 'event_conflict', severity: 'action', file: x.f.name, enumerator: e, hhid: ev.hhid, event_id: ev.event_id,
              detail: `Event ${ev.event_id.slice(0, 8)} differs between ${latest.f.name} and ${x.f.name}. It is left out of the counts until you choose a version.`,
              choices: [{ value: `use:${latest.f.sha}`, label: `Use ${latest.f.name}` }, { value: `use:${x.f.sha}`, label: `Use ${x.f.name}` }, { value: 'exclude', label: 'Leave it out' }] });
            if (!d || d === 'exclude') excludedEvents.add(ev.event_id);
            else if (d === `use:${x.f.sha}`) byId.set(ev.event_id, ev);
          }
        }
        events = latest.f.events.map(ev => byId.get(ev.event_id)).concat(extra);
        const eff = R.effective({ events });
        perEnum.set(e, { file: latest.f, dials: eff.dials, actions: eff.actions, contacts: eff.contacts, events });
      } else {
        const dials = latest.f.rows.map(rowDial);
        dials.forEach(d => { d.dur_min = d.end_ts ? Math.max(0, (Date.parse(d.end_ts) - Date.parse(d.ts)) / 60000) : null; });
        const viaDial = d => ({ event_id: d.event_id, type: 'action', hhid: d.hhid, action: d.action, logged_by: d.logged_by, logged_at: d.logged_at, via: 'dial' });
        const actions = dials.filter(d => d.action).map(viaDial).concat(latest.f.formActions || []);      // a form records actions without a call too
        const haveD = new Set(dials.map(d => d.event_id)), haveA = new Set(actions.map(a => a.event_id));
        let contacts = [];
        const prior = cands.slice(1).find(x => x.f.kind === 'json');
        if (prior) {
          const eff = R.effective({ events: prior.f.events });
          eff.standaloneActions.filter(a => !haveA.has(a.event_id)).forEach(a => { actions.push(a); haveA.add(a.event_id); });
          contacts = eff.contacts;
        }
        // dials an earlier export has and this CSV lacks. A CSV holds only the dials in force, so a dial voided after the
        // earlier export also looks missing: kept, with any action taken with it, unless the leader says it was voided
        const lost = new Map();
        for (const x of cands.slice(1)) {
          const ds = x.f.kind === 'json' ? R.effective({ events: x.f.events }).dials : x.f.rows.map(rowDial);
          ds.filter(d => !haveD.has(d.event_id) && !lost.has(d.event_id)).forEach(d => lost.set(d.event_id, { d, from: x.f.name }));
        }
        if (lost.size) {
          const froms = [...new Set([...lost.values()].map(v => v.from))].join(', ');
          const dec = issue({ key: `gap:${latest.f.sha}`, type: 'gap', severity: 'action', file: latest.f.name, enumerator: e,
            detail: `${latest.f.name} lacks ${R.plural(lost.size, 'dial')} that the earlier ${froms} ${froms.includes(',') ? 'have' : 'has'}. They are kept, as for any gap, unless they were voided after that export.`,
            choices: [{ value: 'keep', label: 'Keep them' }, { value: 'exclude', label: 'Leave them out: voided after the earlier export' }] });
          if (dec !== 'exclude') {
            for (const { d } of lost.values()) {
              if (d.dur_min === undefined) d.dur_min = d.end_ts ? Math.max(0, (Date.parse(d.end_ts) - Date.parse(d.ts)) / 60000) : null;
              dials.push(d);
              if (d.action && !haveA.has(d.event_id)) { actions.push(viaDial(d)); haveA.add(d.event_id); }
            }
          }
        }
        perEnum.set(e, { file: latest.f, dials, actions, contacts, events: null, unverified: true });
      }
    }
    // 3. households: dials outside the enumerator's assignment, two completes, implausible clocks
    const excludedDials = new Set();
    const activatedBy = new Map();
    for (const [e, x] of perEnum) x.actions.filter(a => a.action === 'ACTIVATE_REPLACEMENT' && a.target_hhid).forEach(a => activatedBy.set(a.target_hhid, { e, main: a.hhid, at: a.logged_at }));
    // a replacement's dials name the household they replace, which is all a CSV without its JSON can tell
    for (const [e, x] of perEnum) x.dials.filter(d => d.replaces && !activatedBy.has(d.hhid)).forEach(d => activatedBy.set(d.hhid, { e, main: d.replaces, at: d.logged_at }));
    const mine = (e, h) => assignedTo.get(h) === e || (replOf.has(h) && assignedTo.get(replOf.get(h)) === e) || (activatedBy.has(h) && activatedBy.get(h).e === e);
    for (const [e, x] of perEnum) {
      const byHH = new Map();
      x.dials.forEach(d => { if (!byHH.has(d.hhid)) byHH.set(d.hhid, []); byHH.get(d.hhid).push(d); });
      for (const [h, ds] of byHH) {
        if (mine(e, h)) continue;
        const after = ds.filter(d => !heldBefore(e, h, d.ts));
        if (!after.length) continue;                                   // dials made while the household was theirs, before it was moved
        const mv = (movesOf.get(h) || []).filter(m => m.from === e).slice(-1)[0];
        if (mv) {
          const d = issue({ key: `after_move:${e}:${h}`, type: 'after_move', severity: 'action', enumerator: e, hhid: h,
            detail: `${e} logged ${R.plural(after.length, 'dial')} on ${h} after it was moved to ${mv.to} on ${mv.at.slice(0, 16).replace('T', ' ')}: a double call. Kept and flagged.`,
            choices: [{ value: 'accept', label: 'Keep them' }, { value: 'exclude', label: 'Leave them out' }] });
          if (d === 'exclude') after.forEach(dd => excludedDials.add(dd.event_id));
          continue;
        }
        const known = assignedTo.has(h) || replOf.has(h);
        const d = issue({ key: `not_assigned:${e}:${h}`, type: known ? 'not_assigned' : 'unknown_household', severity: 'action', enumerator: e, hhid: h,
          detail: known ? `${e} logged ${R.plural(ds.length, 'dial')} on ${h}, which is assigned to ${assignedTo.get(h) || assignedTo.get(replOf.get(h))}. Kept and flagged.`
            : `${e} logged ${R.plural(ds.length, 'dial')} on ${h}, which is not in this round's manifest: perhaps a mistyped ID. Kept and flagged.`,
          choices: [{ value: 'reassign', label: `Confirm: ${e} called ${h}` }, { value: 'typo', label: 'Mistyped ID: leave these dials out' }] });
        if (d === 'typo') ds.forEach(dd => excludedDials.add(dd.event_id));
      }
    }
    const window0 = R.zoned(M.calendar.window_start, 0, 0, M.calendar.time_zone).getTime();
    const window1 = R.zoned(R.addDaysKey(M.calendar.window_end, 1), 0, 0, M.calendar.time_zone).getTime();
    for (const [e, x] of perEnum) {
      const expAt = x.file.at || nowMs;
      // an export dated after this computer's clock: one note for the file, not one per dial
      if (x.file.at && x.file.at > nowMs + 86400000) issue({ key: `future_export:${x.file.sha}`, type: 'future_export', severity: 'info', file: x.file.name, enumerator: e,
        detail: `This export is dated ${x.file.exported_at}, later than this computer's clock (${R.localISO(new Date(nowMs)).slice(0, 16)}). One of the two clocks is wrong.` });
      for (const d of x.dials) {
        const ts = Date.parse(d.ts), te = d.end_ts ? Date.parse(d.end_ts) : null, la = Date.parse(d.logged_at);
        const why = [];
        if (ts < window0 || ts >= window1) why.push('outside the round window');
        if (ts > expAt + 300000) why.push('later than its own export');
        if (te !== null && te < ts) why.push('ends before it starts');
        if (la < ts - 60000) why.push('logged before the call started');
        if (!why.length) continue;
        const dd = issue({ key: `clock:${d.event_id}`, type: 'clock', severity: 'action', enumerator: e, hhid: d.hhid, event_id: d.event_id,
          detail: `A dial at ${R.localISO(new Date(ts))} is ${why.join(', ')}. Kept and flagged.`,
          choices: [{ value: 'accept', label: 'Keep it' }, { value: 'exclude', label: 'Leave it out' }] });
        if (dd === 'exclude') excludedDials.add(d.event_id);
      }
    }
    // all valid dials, with the enumerator whose file they came from
    const all = [];
    for (const [e, x] of perEnum) x.dials.forEach(d => { if (!excludedEvents.has(d.event_id) && !excludedDials.has(d.event_id)) all.push(Object.assign({}, d, { source: e })); });
    all.sort((a, b) => cmpStr(a.hhid, b.hhid) || (Date.parse(a.ts) - Date.parse(b.ts)) || cmpStr(a.logged_at, b.logged_at) || cmpStr(a.event_id, b.event_id));
    const n = {};
    all.forEach(d => { n[d.hhid] = (n[d.hhid] || 0) + 1; d.attempt = n[d.hhid]; });
    const actions = [];
    for (const [e, x] of perEnum) x.actions.forEach(a => { if (!excludedEvents.has(a.event_id) && !excludedDials.has(a.event_id)) actions.push(Object.assign({ program: M.program, round: M.round }, a, { source: e })); });
    actions.sort((a, b) => cmpStr(a.logged_at, b.logged_at) || cmpStr(a.event_id, b.event_id));
    // two completes for one household
    const counted = new Map(), conflictHH = new Set();
    const byHH = new Map();
    all.forEach(d => { if (!byHH.has(d.hhid)) byHH.set(d.hhid, []); byHH.get(d.hhid).push(d); });
    for (const [h, ds] of byHH) {
      const cmp = ds.filter(L.qualifies);
      if (cmp.length < 2) { if (cmp.length) counted.set(h, cmp[0]); continue; }
      const who = [...new Set(cmp.map(d => d.source))];
      const dec = issue({ key: `two_completes:${h}`, type: 'two_completes', severity: 'action', hhid: h, enumerator: who.join(', '),
        detail: `${cmp.length} completes for ${h}${who.length > 1 ? ` from ${who.join(' and ')}` : ` from ${who[0]}`}. Left out of the completion counts until you choose one.`,
        choices: cmp.map(d => ({ value: `keep:${d.event_id}`, label: `Keep ${d.source}'s, ${R.localISO(new Date(Date.parse(d.ts))).slice(0, 16).replace('T', ' ')}` }))
          .concat([{ value: 'reinterview', label: 'A re-interview: count the first' }]) });
      if (!dec) { conflictHH.add(h); continue; }
      if (dec === 'reinterview') counted.set(h, cmp[0]);
      else counted.set(h, cmp.find(d => `keep:${d.event_id}` === dec) || cmp[0]);
    }
    // 4. enumerators with no file
    for (const [e, r] of roster) {
      if (perEnum.has(e) || !r.households) continue;
      issue({ key: `missing:${e}`, type: 'missing', severity: 'action', enumerator: e,
        detail: `No export from ${e} for this round. Their ${R.plural(r.households, 'household')} show as "not reported", apart from completes and misses.`,
        choices: [{ value: 'acknowledged', label: 'Noted' }] });
    }
    // contacts files
    const updates = [];
    const digestOf = new Map();
    for (const [, x] of perEnum) (x.contacts || []).forEach(c => digestOf.set(c.event_id, c.private_digest));
    const lastUpd = new Map();                       // a later contacts file repeats the earlier updates: each counts once
    contactFiles.filter(f => f.kind === 'contacts').sort((a, b) => cmpStr(a.exported_at || '', b.exported_at || '') || cmpStr(a.name, b.name))
      .forEach(f => f.updates.forEach(u => lastUpd.set(u.event_id, { f, u })));
    [...lastUpd.values()].forEach(({ f, u }) => {
      const okNum = !u.number || u.private_digest === R.sha256(R.canon({ number: u.number }));
      const okLog = !digestOf.has(u.event_id) || digestOf.get(u.event_id) === u.private_digest;
      updates.push(Object.assign({ enumerator_id: f.enumerator_id, file: f.name, digest_ok: okNum && okLog }, u));
      if (!okNum || !okLog) issue({ key: `contact:${u.event_id}`, type: 'contact_mismatch', severity: 'info', file: f.name, hhid: u.hhid, enumerator: f.enumerator_id,
        detail: `The number for ${u.hhid}, slot ${u.slot}, does not match the digest ${okNum ? 'in the call log' : 'beside it'}.` });
    });
    return { files, issues, perEnum, dials: all, actions, counted, conflictHH, activatedBy, updates, sealedContacts: contactFiles.filter(f => f.kind === 'sealed'), service: ex.service };
  };

  // ---- cases and progress: one line per household of the round (manifest households and activated replacements) ----
  L.cases = (M, G) => {
    const out = new Map();
    const reported = new Set(G.perEnum.keys());
    const add = (h, e, extra) => out.set(h, Object.assign({ hhid: h, enumerator_id: e, dials: [], actions: [] }, extra || {}));
    M.households.forEach(h => add(h.hhid, h.enumerator_id, { reason: h.reason, psu: h.psu, stratum: h.stratum }));
    for (const [h, a] of G.activatedBy) if (!out.has(h)) {
      const m = M.households.find(x => x.hhid === a.main);
      add(h, a.e, { reason: 'replacement', replaces: a.main, psu: m && m.psu, stratum: m && m.stratum });
    }
    G.dials.forEach(d => { if (out.has(d.hhid)) out.get(d.hhid).dials.push(d); });
    G.actions.forEach(a => { if (out.has(a.hhid)) out.get(a.hhid).actions.push(a); });
    const replacedMains = new Set([...G.activatedBy.values()].map(a => a.main));
    for (const c of out.values()) {
      const has = code => c.actions.some(a => a.action === code) || (code === 'ACTIVATE_REPLACEMENT' && replacedMains.has(c.hhid));
      c.complete = G.counted.get(c.hhid) || null;
      c.conflict = G.conflictHH.has(c.hhid);
      c.short = !c.complete && c.dials.some(d => d.status === 'COMPLETE');
      if (c.conflict) c.state = 'conflict';
      else if (c.complete) c.state = 'complete';
      else if (has('ACTIVATE_REPLACEMENT')) c.state = 'replaced';
      else if (has('RELEASE')) c.state = 'released';
      else if (has('REMOVE_REQUEST')) c.state = 'remove_requested';
      else if (c.dials.length) c.state = 'in_progress';
      else c.state = reported.has(c.enumerator_id) ? 'not_started' : 'not_reported';
      c.n = c.dials.length;
    }
    return out;
  };
  L.STATES = { complete: 'Complete', in_progress: 'In progress', not_started: 'Not started', released: 'Released', replaced: 'Replaced',
    remove_requested: 'Removal requested', not_reported: 'Not reported', conflict: 'Two completes' };
  L.progress = (M, C, G) => {
    const tz = M.calendar.time_zone;
    const rows = new Map();
    const row = e => { if (!rows.has(e)) rows.set(e, { enumerator_id: e, households: 0, complete: 0, in_progress: 0, not_started: 0, released: 0, replaced: 0, remove_requested: 0, not_reported: 0, conflict: 0, dials: 0, days: new Set(), last_export: '' }); return rows.get(e); };
    M.enumerators.forEach(e => row(e.enumerator_id));
    for (const c of C.values()) { const r = row(c.enumerator_id); r.households++; r[c.state]++; }
    G.dials.forEach(d => { const r = row(d.source); r.dials++; r.days.add(R.partsIn(new Date(Date.parse(d.ts)), tz).key); });
    for (const [e, x] of G.perEnum) row(e).last_export = x.file.exported_at || '';
    const list = [...rows.values()].sort((a, b) => cmpStr(a.enumerator_id, b.enumerator_id));
    list.forEach(r => { r.enumerator_days = r.days.size; delete r.days; r.completes_per_day = r.enumerator_days ? r.complete / r.enumerator_days : null; });
    const tot = { enumerator_id: 'All', households: 0, complete: 0, in_progress: 0, not_started: 0, released: 0, replaced: 0, remove_requested: 0, not_reported: 0, conflict: 0, dials: 0, enumerator_days: 0 };
    list.forEach(r => Object.keys(tot).forEach(k => { if (k !== 'enumerator_id') tot[k] += r[k]; }));
    tot.completes_per_day = tot.enumerator_days ? tot.complete / tot.enumerator_days : null;
    // completes by day of the window, and by stratum
    const byDay = new Map();
    for (const c of C.values()) if (c.complete) { const k = R.partsIn(new Date(Date.parse(c.complete.ts)), tz).key; byDay.set(k, (byDay.get(k) || 0) + 1); }
    const days = [];
    let cum = 0;
    for (let k = M.calendar.window_start; k <= M.calendar.window_end; k = R.addDaysKey(k, 1)) { cum += byDay.get(k) || 0; days.push({ day: k, completes: byDay.get(k) || 0, cumulative: cum }); }
    const strata = new Map();
    for (const c of C.values()) {
      const s = c.stratum || '–';
      if (!strata.has(s)) strata.set(s, { stratum: s, households: 0, complete: 0 });
      strata.get(s).households++; if (c.state === 'complete') strata.get(s).complete++;
    }
    return { list, total: tot, days, strata: [...strata.values()].sort((a, b) => cmpStr(a.stratum, b.stratum)) };
  };

  // ---- moving waiting households during the round: who will not finish at the current pace ----
  // Pace = completes per enumerator-day so far (Box 3.0); capacity = pace × working days left; need = open − capacity.
  // Only enumerators whose export is from today and who have two or more enumerator-days are judged.
  L.pace = (M, C, P, now) => {
    const cal = R.calendarOf({ calendar: M.calendar }), today = R.partsIn(now, cal.tz).key;
    const left = R.workingDaysLeft(cal, today);
    const rows = P.list.map(r => {
      const open = r.not_started + r.in_progress, exportDay = r.last_export ? r.last_export.slice(0, 10) : '';
      const known = r.enumerator_days >= 2 && r.completes_per_day !== null;
      const row = { enumerator_id: r.enumerator_id, households: r.households, complete: r.complete, open, waiting: r.not_started, in_progress: r.in_progress,
        pace: r.completes_per_day, enumerator_days: r.enumerator_days, days_left: left, export_at: r.last_export || '', export_day: exportDay, fresh: exportDay === today, known };
      row.capacity = known ? r.completes_per_day * left : null;
      row.need = known ? open - row.capacity : null;
      row.projected = known ? Math.min(r.households, r.complete + Math.floor(row.capacity + 1e-9)) : null;
      row.why = !r.last_export ? 'no export yet' : !row.fresh ? `last export ${exportDay}, not today` : !known ? 'fewer than two enumerator-days: the pace cannot be judged yet' : '';
      return row;
    });
    return { rows, today, days_left: left };
  };
  // which households may move: never dialed; or, if the leader allows, dialed without a booked callback or a hard refusal
  L.movable = (c, include) => {
    if (c.replaces) return false;
    if (c.state === 'not_started') return true;
    if (include !== 'in_progress' || c.state !== 'in_progress') return false;
    const last = c.dials[c.dials.length - 1];
    if (last && last.appointment_ts) return false;
    return !c.dials.some(d => d.status === 'REFUSAL_HARD');
  };
  // one household at a time from the enumerator furthest behind to the one with most spare capacity, latest-planned first,
  // only to an enumerator who matches the household's criteria, until nobody is more than half a household behind or ahead
  L.proposeMoves = (pace, C, opts) => {
    const o = Object.assign({ include: 'not_started', from: null, to: null, eligible: null, hh: null, planOf: null, allowStale: false }, opts || {});
    const judged = r => r.known && (r.fresh || o.allowStale);
    const rows = pace.rows.filter(judged);
    const need = new Map(rows.map(r => [r.enumerator_id, r.need]));
    const planned = id => (o.planOf && o.planOf(id)) || '';
    const rank = c => (c.state === 'not_started' ? 0 : 1);          // never dialed households first, then the latest planned
    const cands = new Map(rows.map(r => [r.enumerator_id, [...C.values()].filter(c => c.enumerator_id === r.enumerator_id && L.movable(c, o.include))
      .sort((a, b) => rank(a) - rank(b) || cmpStr(planned(b.hhid), planned(a.hhid)) || cmpStr(b.hhid, a.hhid))]));
    const moves = [];
    for (let guard = 0; guard < 5000; guard++) {
      const donors = rows.filter(r => need.get(r.enumerator_id) > 0.5 && (!o.from || o.from.includes(r.enumerator_id))).sort((a, b) => need.get(b.enumerator_id) - need.get(a.enumerator_id) || cmpStr(a.enumerator_id, b.enumerator_id));
      const takers = rows.filter(r => need.get(r.enumerator_id) < -0.5 && (!o.to || o.to.includes(r.enumerator_id))).sort((a, b) => need.get(a.enumerator_id) - need.get(b.enumerator_id) || cmpStr(a.enumerator_id, b.enumerator_id));
      let done = false;
      for (const d of donors) {
        const list = cands.get(d.enumerator_id);
        for (const t of takers) {
          const i = list.findIndex(c => !o.eligible || !o.hh || !o.hh.get(c.hhid) || o.eligible(o.hh.get(c.hhid), t.enumerator_id));
          if (i < 0) continue;
          const c = list.splice(i, 1)[0];
          moves.push({ hhid: c.hhid, from: d.enumerator_id, to: t.enumerator_id, state: c.state, dials: c.n, planned: planned(c.hhid) });
          need.set(d.enumerator_id, need.get(d.enumerator_id) - 1); need.set(t.enumerator_id, need.get(t.enumerator_id) + 1);
          done = true; break;
        }
        if (done) break;
      }
      if (!done) break;
    }
    return { moves, need, judged: rows.map(r => r.enumerator_id), left_out: pace.rows.filter(r => !judged(r)).map(r => ({ id: r.enumerator_id, why: r.why || (!r.fresh ? `last export ${r.export_day}, not today` : 'pace not known') })) };
  };
  // the revised files: a new assignment file for each enumerator who gives or receives a household, and the manifest's next
  // revision. Contacts come from the household list (with the numbers enumerators corrected this round); a moved household
  // carries the dials made before the move (handover), a first dial on the next working day, and its usual hour.
  L.reviseFiles = inp => {
    const M = inp.M, at = inp.at, moved = new Map(inp.moves.map(m => [m.hhid, m]));
    const affected = new Set(); inp.moves.forEach(m => { affected.add(m.from); affected.add(m.to); });
    const cal = R.calendarOf({ calendar: M.calendar }), today = R.partsIn(inp.now || R.now(), cal.tz).key;
    let first = today < cal.start ? cal.start : today, guard = 0;
    while (!cal.isWorking(first) && first < cal.end && guard++ < 60) first = R.addDaysKey(first, 1);
    const upd = new Map();                           // hhid -> slot -> the corrected number, from the merged contacts files
    (inp.updates || []).filter(u => u.digest_ok && u.number).forEach(u => { if (!upd.has(u.hhid)) upd.set(u.hhid, new Map()); upd.get(u.hhid).set(+u.slot, u); });
    const contactNow = (H, id, slotLast) => {
      const c = contactOf(H || { phones: [] }, slotLast), m = upd.get(id);
      if (m) {
        for (const [slot, u] of m) {
          const p = c.phones.find(x => x.slot === slot);
          if (p) { p.number = u.number; if (u.label) p.label = u.label; delete p.last_status; } else c.phones.push(R.clean({ slot, number: u.number, label: u.label }));
        }
        c.phones.sort((a, b) => a.slot - b.slot);
      }
      return c;
    };
    const elig = M.matching ? { criteria: M.matching.criteria } : null;
    const households = M.households.map(h => (moved.has(h.hhid) ? Object.assign({}, h, { enumerator_id: moved.get(h.hhid).to, reason: 'mid_round', previous_enumerator: h.enumerator_id,
      matched: M.matching ? (inp.matchedNow ? inp.matchedNow(h.hhid, moved.get(h.hhid).to) : undefined) : undefined }) : h));
    const files = [];
    for (const e of [...affected].sort(cmpStr)) {
      const mine = households.filter(h => h.enumerator_id === e).sort((a, b) => cmpStr(a.hhid, b.hhid));
      const entries = mine.map(h => {
        const H = inp.hh.get(h.hhid), c = inp.C.get(h.hhid), s = inp.sumOf ? inp.sumOf(h.hhid) : null, m = moved.get(h.hhid);
        const reps = (h.replacements || []).map((id, i) => ({ hhid: id, rank: i + 1, contact: contactNow(inp.hh.get(id), id) }));
        const last = c && c.dials.length ? c.dials[c.dials.length - 1] : null;
        const li = s && s.last_interview ? R.clean({ round: s.last_interview.round, date: s.last_interview.date, hour: s.last_interview.hour }) : undefined;
        const pl = inp.plans ? inp.plans.get(h.hhid) : null;
        const crit = elig && H ? Object.fromEntries(elig.criteria.map(k => [k, L.hhValue(H, k)]).filter(([, v]) => v)) : null;
        return R.clean({
          hhid: h.hhid, psu: h.psu, stratum: h.stratum, tz: H && H.tz,
          contact: contactNow(H, h.hhid, s && s.slot_last),
          history: s ? R.clean({ joined_round: s.joined_round === null ? M.round : s.joined_round, last_interview: li, last3: s.last3 || undefined, last_enumerator: s.last_interview ? s.last_interview.enumerator : undefined }) : undefined,
          assignment: R.clean({ reason: h.reason, previous_enumerator: h.previous_enumerator, matched: h.matched }),
          criteria: crit && Object.keys(crit).length ? crit : undefined,
          plan: m ? R.clean({ first_dial_date: first, target_hour: pl && Number.isInteger(pl.target_hour) ? pl.target_hour : (li && Number.isInteger(li.hour) ? li.hour : undefined) }) : pl || undefined,
          handover: m ? R.clean({ from: m.from, moved_at: at, dials: c ? c.n : 0, last_status: last ? last.status : undefined, last_ts: last ? last.ts : undefined }) : undefined,
          replacements: reps.length ? reps : undefined,
        });
      });
      const old = M.enumerators.find(x => x.enumerator_id === e);
      const a = R.clean({
        schema: R.SCHEMA.assign, tool_version: R.VERSION, program: M.program, country: M.country, round: M.round, enumerator_id: e,
        generated_by: inp.leader, generated_at: at, revision: (M.revision || 1) + 1, supersedes: old ? old.fingerprint : undefined,
        rule: M.rule, replacement_policy: M.replacement_policy, matching: M.matching ? { criteria: M.matching.criteria, enumerator: (M.matching.enumerators || {})[e] || {} } : undefined,
        synthetic: M.synthetic ? true : undefined, note: `Revision ${(M.revision || 1) + 1} of this round's assignment: ${inp.moves.filter(x => x.to === e).length} household(s) moved to you, ${inp.moves.filter(x => x.from === e).length} moved from you.`,
        calendar: M.calendar, households: entries,
      });
      a.fingerprint = R.fingerprint(a);
      files.push({ enumerator_id: e, name: `${e}_assignment_R${p2(M.round)}.json`, obj: a });
    }
    const manifest = Object.assign({}, M, {
      generated_at: at, revision: (M.revision || 1) + 1, supersedes: M.fingerprint,
      enumerators: M.enumerators.map(x => {
        const f = files.find(y => y.enumerator_id === x.enumerator_id);
        return f ? Object.assign({}, x, { households: f.obj.households.length, fingerprint: f.obj.fingerprint, previous_fingerprints: (x.previous_fingerprints || []).concat([x.fingerprint]) }) : x;
      }),
      households, moves: (M.moves || []).concat(inp.moves.map(m => ({ hhid: m.hhid, from: m.from, to: m.to, at, by: inp.leader }))),
    });
    delete manifest.fingerprint;
    manifest.fingerprint = R.fingerprint(manifest);
    return { files, manifest, affected: [...affected].sort(cmpStr) };
  };

  // ---- the round's outputs (A.6) ----
  L.callsRows = G => G.dials.map(d => Object.assign(R.dialRow(d), { attempt: d.attempt }));
  L.actionsRows = G => G.actions.map(a => ({ program: a.program, round: a.round, hhid: a.hhid, action: a.action, target_hhid: a.target_hhid || '', reason: a.reason || '',
    note: a.note || '', via: a.via || '', logged_by: a.logged_by, logged_at: a.logged_at, event_id: a.event_id }));
  L.REPORT_COLS = ['type', 'severity', 'status', 'enumerator', 'hhid', 'file', 'detail', 'decision', 'resolved_by', 'resolved_at', 'note', 'key'];
  L.reportRows = G => G.issues.map(i => ({ type: i.type, severity: i.severity, status: i.status, enumerator: i.enumerator || '', hhid: i.hhid || '', file: i.file || '',
    detail: i.detail, decision: i.decision || '', resolved_by: i.by || '', resolved_at: i.at || '', note: i.note || '', key: i.key }));
  L.CONTACT_COLS = ['hhid', 'slot', 'change', 'number', 'label', 'enumerator_id', 'logged_by', 'logged_at', 'event_id', 'digest_ok', 'file'];
  L.contactRows = G => G.updates.map(u => ({ hhid: u.hhid, slot: u.slot, change: u.change, number: u.number || '', label: u.label || '', enumerator_id: u.enumerator_id,
    logged_by: u.logged_by, logged_at: u.logged_at, event_id: u.event_id, digest_ok: u.digest_ok ? 1 : 0, file: u.file }));
  L.validManifest = m => !!(m && m.schema === L.SCHEMA.manifest && Array.isArray(m.households) && Array.isArray(m.enumerators) && m.calendar);
})();
</script>
<script>/* RTM interview tool, leader side: attrition and operational analytics computed the way the handbook computes them.
   Each function follows a handbook script (named in its comment) on the same definitions: the harmonized dial and
   case tables of 10_build_attempts.py, Section 3.3 (11_s33_attempts.py), 3.4 (14_s34_contacts.py), 2.4.4 and Box 2.0
   (20d_s36_benchmarks.py), 3.1 (12_s31_enumerators.py) and 3.5 (15_s35_scheduling.py). Unweighted; local clock time. */
(function () {
  'use strict';
  const S = window.LSTATS = {};
  const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  S.MIN_COMPLETE_MIN = 3.0;
  S.MIN_CELL = 10;

  S.wilson = (k, n) => {
    if (!n) return null;
    const z = 1.96, p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
    return { k, n, p, lo: Math.max(0, c - h), hi: Math.min(1, c + h) };
  };
  const median = arr => {
    const a = arr.filter(x => x !== null && x !== undefined && !isNaN(x)).slice().sort((x, y) => x - y);
    if (!a.length) return null;
    const m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };
  S.median = median;
  const dayNum = k => Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)) / 86400000;
  const weekday = k => (new Date(dayNum(k) * 86400000).getUTCDay() + 6) % 7;   // Monday 0 … Sunday 6
  const normOp = s => String(s || '').trim().replace(/_/g, '').toUpperCase();
  const blankOp = s => ['', 'nan', 'None', 'undefined', 'null'].includes(String(s === undefined || s === null ? '' : s).trim());

  // ---- the harmonized dial and case tables (10_build_attempts.py, finish_cases) ----
  // input dials: {hhid, round, wall 'YYYY-MM-DD HH:MM:SS' (the recorded local clock), status, cmp_code, dur (minutes or null), operator}
  S.build = input => {
    let d = input.filter(x => x.hhid && x.round && x.wall && /^\d{4}-\d\d-\d\d/.test(x.wall)).map((x, i) => Object.assign({}, x, { seq: i }));
    const seen = new Set();
    d = d.filter(x => { const k = `${x.hhid}|${x.round}|${x.wall}|${x.status}`; if (seen.has(k)) return false; seen.add(k); return true; });
    d.sort((a, b) => cmpStr(a.hhid, b.hhid) || a.round - b.round || cmpStr(a.wall, b.wall) || a.seq - b.seq);
    d.forEach(x => { x.date = x.wall.slice(0, 10); x.dn = dayNum(x.date); x.hour = +x.wall.slice(11, 13); x.minute = +x.wall.slice(14, 16); });
    // clock errors: more than 90 whole days from the round's median dial date
    const byRound = new Map();
    d.forEach(x => { if (!byRound.has(x.round)) byRound.set(x.round, []); byRound.get(x.round).push(x.dn); });
    const med = new Map([...byRound].map(([r, a]) => [r, median(a)]));
    const dropped = { clock: 0, after_complete: 0, duplicates: input.length - seen.size };
    d = d.filter(x => { const bad = Math.floor(Math.abs(x.dn - med.get(x.round))) > 90; if (bad) dropped.clock++; return !bad; });
    d.forEach(x => { x.is_cmp = !!x.cmp_code && x.dur !== null && x.dur !== undefined && x.dur >= S.MIN_COMPLETE_MIN; });
    // attempt, day index and new day within the case; the completing dial, with the scripts' fallback
    const cases = new Map();
    for (const x of d) {
      const key = `${x.hhid}|${x.round}`;
      if (!cases.has(key)) cases.set(key, { hhid: x.hhid, round: x.round, dials: [] });
      cases.get(key).dials.push(x);
    }
    const kept = [];
    for (const c of cases.values()) {
      let prevDate = null, day = 0;
      c.dials.forEach((x, i) => {
        x.attempt = i + 1;
        if (x.date !== prevDate) day++;
        x.day_idx = day;
        x.new_day = i === 0 || x.date > prevDate;
        prevDate = x.date;
      });
      const q = c.dials.find(x => x.is_cmp), f = c.dials.find(x => x.cmp_code);
      c.k_complete = q ? q.attempt : f ? f.attempt : null;
      c.fallback = !q && !!f;
      if (c.k_complete) { dropped.after_complete += c.dials.length - c.k_complete; c.dials = c.dials.slice(0, c.k_complete); }
      c.dials.forEach(x => { x.k_complete = c.k_complete; x.ok = x.attempt === c.k_complete; kept.push(x); });
      c.n_att = c.dials.length;
      c.n_days = c.dials[c.dials.length - 1].day_idx;
      c.completed = !!c.k_complete;
      c.first_date = c.dials[0].date;
      const op = c.dials.find(x => !blankOp(x.operator));
      c.operator = op ? op.operator : null;
      c.complete_dial = c.completed ? c.dials[c.k_complete - 1] : null;
    }
    const rounds = [...new Set(kept.map(x => x.round))].sort((a, b) => a - b);
    return { dials: kept, cases, rounds, dropped, fallbacks: [...cases.values()].filter(c => c.fallback).length };
  };

  // ---- Section 3.3: dials per complete, hazard by dial, and missed households (11_s33_attempts.py) ----
  const K = 20;
  S.s33 = (T, rounds) => {
    const cs = [...T.cases.values()].filter(c => rounds.includes(c.round));
    const sum = list => {
      const done = list.filter(c => c.completed), n = list.length, dials = list.reduce((s, c) => s + c.n_att, 0);
      const cum = Array(K).fill(0);
      done.forEach(c => { cum[Math.min(c.k_complete, K) - 1]++; });
      for (let k = 1; k < K; k++) cum[k] += cum[k - 1];
      const share = cum.map(x => (done.length ? x / done.length : null));
      const firstAt = th => { const i = share.findIndex(x => x !== null && x >= th); return i < 0 ? null : i + 1; };
      return { cases: n, dials, completes: done.length, dials_per_complete: done.length ? dials / done.length : null, completion_rate: n ? done.length / n : null,
        first_dial_share: done.length ? done.filter(c => c.k_complete === 1).length / done.length : null, k50: firstAt(0.5), k90: firstAt(0.9),
        median_dials_noncomplete: median(list.filter(c => !c.completed).map(c => c.n_att)), share_of_completes: share };
    };
    const pooled = sum(cs);
    const byRound = rounds.map(r => Object.assign({ round: r }, sum(cs.filter(c => c.round === r))));
    // hazard: at risk at k = cases with at least k dials (dials after a complete are deleted, so these are the pending cases)
    const hazard = [];
    for (let k = 1; k <= K; k++) {
      const atRisk = cs.filter(c => c.n_att >= k).length;
      const comp = cs.filter(c => c.completed && (k < K ? c.k_complete === k : c.k_complete >= K)).length;
      const w = atRisk >= S.MIN_CELL ? S.wilson(comp, atRisk) : null;
      hazard.push({ k, at_risk: atRisk, completes: comp, hazard: w ? w.p : null, lo: w ? w.lo : null, hi: w ? w.hi : null });
    }
    // 3.3.5: households completed in r-1, dialled and not completed in r, with round r+1 in the data
    const done = new Set(cs.filter(c => c.completed).map(c => `${c.hhid}|${c.round}`));
    const dialled = new Set(cs.map(c => `${c.hhid}|${c.round}`));
    const lost = cs.filter(c => done.has(`${c.hhid}|${c.round - 1}`) && !c.completed && rounds.includes(c.round + 1));
    const redial = lost.filter(c => dialled.has(`${c.hhid}|${c.round + 1}`));
    const back = redial.filter(c => done.has(`${c.hhid}|${c.round + 1}`));
    const missed = { newly_missed: lost.length, redialled: S.wilson(redial.length, lost.length),
      back_given_redial: redial.length >= S.MIN_CELL ? S.wilson(back.length, redial.length) : null,
      median_dials: median(lost.map(c => c.n_att)), median_days: median(lost.map(c => c.n_days)) };
    return { pooled, byRound, hazard, missed };
  };

  // ---- who was interviewed in each round: interview records where loaded, otherwise call-log completes ----
  S.interviewed = (T, records) => {
    const m = new Map();
    for (const c of T.cases.values()) if (c.completed) { if (!m.has(c.round)) m.set(c.round, new Set()); m.get(c.round).add(c.hhid); }
    const source = new Map([...m.keys()].map(r => [r, 'call log']));
    if (records) for (const [r, recs] of records) {
      const s = new Set();
      for (const [h, x] of recs) if (x.complete) s.add(h);
      m.set(r, s); source.set(r, 'interview records');
    }
    return { sets: m, source };
  };

  // ---- Box 2.0, Section 2.4.4 and Section 3.4.3: continuation, retention, loss and returns (20d_s36_benchmarks.py, 14_s34_contacts.py) ----
  S.s34 = (I, rounds, roundDates) => {
    const sets = I.sets, rs = rounds.filter(r => sets.has(r)).sort((a, b) => a - b);
    const out = { rounds: rs, consecutive: rs.every((r, i) => i === 0 || r === rs[i - 1] + 1) };
    if (!rs.length) return out;
    const has = (h, r) => sets.has(r) && sets.get(r).has(h);
    const last = rs[rs.length - 1], W = 3;
    // continuation, consecutive pairs only
    out.continuation = [];
    for (let i = 1; i < rs.length; i++) {
      const a = rs[i - 1], b = rs[i];
      if (b !== a + 1) continue;
      const prev = sets.get(a), both = [...prev].filter(h => sets.get(b).has(h)).length;
      const later = new Set(); rs.filter(r => r > b).forEach(r => sets.get(r).forEach(h => later.add(h)));
      const missedThenBack = [...prev].filter(h => !sets.get(b).has(h) && later.has(h)).length;
      out.continuation.push({ from: a, round: b, base: prev.size, share: prev.size ? both / prev.size : null, loss: prev.size ? 1 - both / prev.size : null,
        back_later: rs.some(r => r > b) && prev.size ? missedThenBack / prev.size : null });
    }
    const shares = out.continuation.map(x => x.share).filter(x => x !== null);
    out.continuation_median = median(shares);
    out.continuation_min = shares.length ? Math.min(...shares) : null;
    // Box 2.0 / 2.4.4 retention: first-round households interviewed in that round, without returns
    const first = rs[0], base = sets.get(first);
    out.retention_first = rs.map(r => ({ round: r, k: r - first, months: roundDates && roundDates.get(r) && roundDates.get(first) ? (dayNum(roundDates.get(r)) - dayNum(roundDates.get(first))) / 30.4375 : null,
      share: base.size ? [...base].filter(h => has(h, r)).length / base.size : null, base: base.size }));
    // entry round, newcomers and recruitment waves (14_s34, l.158-198)
    const entry = new Map();
    for (const r of rs) for (const h of sets.get(r)) if (!entry.has(h)) entry.set(h, r);
    const newShare = new Map(rs.map(r => [r, sets.get(r).size ? [...sets.get(r)].filter(h => entry.get(h) === r).length / sets.get(r).size : 0]));
    out.newcomers = rs.map(r => ({ round: r, share: newShare.get(r), interviews: sets.get(r).size }));
    out.newcomers_median = median(rs.slice(1).map(r => newShare.get(r)));
    const opening = [first];
    for (const r of rs.slice(1)) { if (newShare.get(r) >= 0.05) opening.push(r); else break; }
    const later = [];
    let run = [];
    for (const r of rs) {
      if (opening.includes(r)) continue;
      if (newShare.get(r) >= 0.05) run.push(r); else { if (run.length >= 3) later.push(...run); run = []; }
    }
    if (run.length >= 3) later.push(...run);
    out.waves = { opening, later };
    const original = h => opening.includes(entry.get(h)) || later.includes(entry.get(h));

window.RTM_RISK_CARD = "# Model card: dropout risk and return likelihood\n\nWritten by `models/make_card.py` from the backtests of `models/train_risk.py` (trained 2026-10-27). Every number below comes from those files. The tool shows this card beside every risk list.\n\n## What the models predict\n\n| Model | For | Predicts | Handbook measure | What the leader does with it |\n|---|---|---|---|---|\n| Dropout risk | a household interviewed in the last round | not interviewed in this round | loss, the complement of continuation (Box 2.0, Section 3.4.3) | give it an early first dial at its usual hour, keep its enumerator, check its numbers, collect another number |\n| Return likelihood | a household interviewed two rounds ago and missed last round | interviewed again within the next three rounds | returns (Sections 3.3.5 and 3.4.3) | order the redials; never drop a household, which the handbook rules out (3.3.5) |\n\nInterviewed means a completed call-log case, as the handbook's build script defines it. A tier is never a prediction about one household: it says how similar households fared.\n\n## Training data\n\n| Program | Rounds used | Round numbers | Cases | Dropout pairs | Return pairs | Number codes | Refusal codes | Call length |\n|---|---|---|---|---|---|---|---|---|\n| L2CU | 79 | 2\u201382 | 125,670 | 115,609 | \u2013 | yes | no | yes |\n| L2T | 15 | 1\u201317 | 35,679 | 25,387 | \u2013 | no | no | yes |\n| L2KGZ | 30 | 1\u201342 | 50,948 | 33,011 | \u2013 | no | no | yes |\n| L2Kaz | 32 | 1\u201333 | 58,272 | 44,489 | \u2013 | yes | yes | yes |\n| L2PHL | 9 | 2\u201310 | 22,055 | 9,378 | 1,405 | yes | yes | yes |\n| L2Indo | 15 | 1\u201328 | 68,962 | 12,164 | 1,675 | yes | yes | no |\n\nThe handbook's harmonized case and dial tables of its six programs with dial logs, kept locally and never published. Loss rate over all dropout pairs: 5.0%; return rate over all return pairs: 46.6%. The return model uses L2PHL and L2Indo only, because they redial almost every missed household; elsewhere the households redialed are chosen, and a model would learn the team's choice rather than the household's chance (3.3.5). Training writes only coefficients and the aggregates below, with no household ID and with cells under 10 suppressed.\n\n## Features\n\nOperational only: no demographic feature. Each is computed from what is known before the round predicted.\n\n| Dropout model | Coefficient | 95% interval | z | p | Mean | SD |\n|---|---|---|---|---|---|---|\n| Joined in the round before | +0.282 | +0.263 to +0.300 | 29.5 | <0.001 | 0.07 | 0.25 |\n| Joined two rounds before | +0.131 | +0.114 to +0.148 | 15.1 | <0.001 | 0.05 | 0.21 |\n| Joined three rounds before | +0.074 | +0.057 to +0.091 | 8.7 | <0.001 | 0.04 | 0.20 |\n| In the panel 7 to 12 rounds | -0.060 | -0.086 to -0.034 | -4.6 | <0.001 | 0.17 | 0.38 |\n| In the panel 13 rounds or more | -0.377 | -0.411 to -0.343 | -21.7 | <0.001 | 0.56 | 0.50 |\n| Rounds missed among the three before | +0.203 | +0.185 to +0.221 | 22.7 | <0.001 | 0.05 | 0.31 |\n| Missed the round before | +0.020 | +0.003 to +0.036 | 2.3 | 0.019 | 0.02 | 0.13 |\n| Dials needed last round (log) | +0.264 | +0.235 to +0.294 | 17.5 | <0.001 | 1.24 | 0.60 |\n| Days needed last round | +0.110 | +0.088 to +0.132 | 9.8 | <0.001 | 1.72 | 1.43 |\n| Same enumerator in the last two interviews | -0.092 | -0.114 to -0.070 | -8.2 | <0.001 | 0.79 | 0.41 |\n| Last round's first dial within an hour of the interview before | -0.031 | -0.057 to -0.006 | -2.4 | 0.016 | 0.20 | 0.40 |\n| Last interview at 18:00 or later | +0.019 | -0.002 to +0.040 | 1.8 | 0.080 | 0.20 | 0.40 |\n| Last interview before 12:00 | -0.034 | -0.057 to -0.012 | -3.0 | 0.003 | 0.24 | 0.42 |\n| Length of the last interview (minutes) | +0.010 | -0.011 to +0.030 | 0.9 | 0.351 | 13.08 | 7.83 |\n| A number not working or switched off last round | +0.029 | +0.005 to +0.053 | 2.3 | 0.020 | 0.09 | 0.29 |\n| A refusal last round before the interview | -0.015 | -0.034 to +0.004 | -1.5 | 0.130 | 0.02 | 0.12 |\n\n\n| Return model | Coefficient | 95% interval | z | p | Mean | SD |\n|---|---|---|---|---|---|---|\n| Joined in the round before the miss | -0.408 | -0.516 to -0.299 | -7.3 | <0.001 | 0.32 | 0.47 |\n| Joined two rounds before the miss | -0.223 | -0.315 to -0.132 | -4.8 | <0.001 | 0.11 | 0.31 |\n| Joined three rounds before the miss | -0.077 | -0.168 to +0.014 | -1.6 | 0.098 | 0.18 | 0.38 |\n| In the panel 7 to 12 rounds | -0.027 | -0.106 to +0.051 | -0.7 | 0.494 | 0.05 | 0.22 |\n| In the panel 13 rounds or more | -0.307 | -0.402 to -0.213 | -6.4 | <0.001 | 0.09 | 0.28 |\n| Rounds missed among the three before the last interview | -0.207 | -0.296 to -0.119 | -4.6 | <0.001 | 0.27 | 0.60 |\n| Dialed in the missed round | -0.049 | -0.144 to +0.046 | -1.0 | 0.315 | 0.99 | 0.08 |\n| Dials in the missed round (log) | -0.130 | -0.307 to +0.047 | -1.4 | 0.150 | 2.08 | 0.68 |\n| Days dialed in the missed round | -0.294 | -0.483 to -0.106 | -3.1 | 0.002 | 5.25 | 3.08 |\n| Reached in the missed round, no interview | +0.147 | +0.070 to +0.223 | 3.7 | <0.001 | 0.35 | 0.48 |\n| A refusal in the missed round | -0.100 | -0.177 to -0.023 | -2.5 | 0.011 | 0.10 | 0.30 |\n| A number not working or switched off in the missed round | +0.028 | -0.082 to +0.138 | 0.5 | 0.621 | 0.47 | 0.50 |\n| Dials needed at the last interview (log) | -0.017 | -0.097 to +0.063 | -0.4 | 0.681 | 1.54 | 0.63 |\n| Missed round first dialed by the enumerator of the last interview | +0.026 | -0.088 to +0.140 | 0.5 | 0.655 | 0.61 | 0.49 |\n\nSignificance (`models/coef_significance.py`): standard errors from the sandwich estimator of the same penalised fit, with households as clusters, since a household contributes several household-rounds (240,038 household-rounds from 18,152 households for dropout; 3,080 from 2,550 for return). z is the coefficient over its standard error; p is two-sided. With this many household-rounds, small effects reach significance: the size of a coefficient and the backtests below say more about the lists than p does. Features are correlated (the tenure bands, the missed rounds), so each coefficient is the feature's effect with the others held fixed. 95% intervals that include zero: dropout, last interview at 18:00 or later, length of the last interview (minutes), a refusal last round before the interview; return, joined three rounds before the miss, in the panel 7 to 12 rounds, dialed in the missed round, dials in the missed round (log), a number not working or switched off in the missed round, dials needed at the last interview (log), missed round first dialed by the enumerator of the last interview.\n\n\nCoefficients are per standard deviation, from a ridge-penalised logistic regression with one intercept per program. Rounds since joining is compared with 4 to 6 rounds. A feature a program's codes do not define counts as average for that program. In the tool, the explanation adds up the contributions of related features and describes the household's own values.\n\n**Left out on purpose:** household size, the respondent's sex and age, education, region, urban or rural, language, and every survey answer. Region and urban or rural are sampling variables, but they would steer effort by place; survey answers would steer it by welfare. The leader view shows how each tier divides by stratum, so that any concentration in one area is visible.\n\n**Not in the training tables:** the number of phone numbers and whether another number was used. The tool records both, so a program can add them once its own data allow a refit.\n\n## How well they work, on data they were not trained on\n\n### Dropout risk, each program left out in turn\n\nTrained on five programs, tested on the sixth with the average intercept: the honest test for a new program such as Mongolia.\n\n| Program left out | Household-rounds | Loss rate | AUC | AUC, tenure only | AUC, dials rule | AUC, boosted trees | Brier / no model | Losses in the high tier | \u2026 tenure only |\n|---|---|---|---|---|---|---|---|---|---|\n| L2CU | 115,609 | 1.0% | 0.72 | 0.64 | 0.60 | 0.72 | 0.0107 / 0.0099 | 41% | 29% |\n| L2T | 25,387 | 6.8% | 0.75 | 0.67 | 0.58 | 0.74 | 0.0607 / 0.0633 | 42% | 31% |\n| L2KGZ | 33,011 | 3.0% | 0.72 | 0.63 | 0.61 | 0.71 | 0.0285 / 0.0293 | 44% | 30% |\n| L2Kaz | 44,489 | 9.1% | 0.75 | 0.70 | 0.59 | 0.71 | 0.0813 / 0.0830 | 35% | 24% |\n| L2PHL | 9,378 | 22.9% | 0.72 | 0.59 | 0.58 | 0.65 | 0.1795 / 0.1766 | 29% | 26% |\n| L2Indo | 12,164 | 15.3% | 0.69 | 0.60 | 0.57 | 0.65 | 0.1373 / 0.1299 | 31% | 21% |\n\nAUC is the chance that a lost household scores above a kept one (0.5 is no better than chance). The high tier is the top 15% of each round's households. The two baselines: the loss rate by rounds since joining alone (the handbook's hazard curve), and the rule \"needed more dials than three households in four last round\". The boosted trees are a check on the model's form. They ranked households no better than the logistic model in any program (AUC); their chances were somewhat closer to what happened in L2CU, L2Kaz, L2PHL, L2Indo (Brier), which bears on calibration, and the tool recalibrates chances on the program's own rounds before showing any. The logistic model, whose explanations are clearer, is the one used.\n\n### Dropout risk, with the program's own past rounds\n\nRolling origin: at each round, only the rounds whose outcomes were already known are used. \"Recalibrated\" here is the model trained on the other five programs, with its intercept and slope refitted on the program's own past rounds once two rounds have outcomes. The tool does the same for a new program with the model trained on all six.\n\n| Program | Rounds tested | AUC, own rounds only | AUC, recalibrated | Brier, recalibrated / as is | Losses in the high tier | High tier: loss rate (95% CI) | Medium tier | Low tier |\n|---|---|---|---|---|---|---|---|---|\n| L2CU | 75 | 0.74 | 0.74 | 0.0095 / 0.0099 | 42% | 2.7% (2.5%\u20132.9%)       <p class="muted">${holsIn.length ? `Holidays in the window: ${holsIn.map(h => `${dayLabel(h.date)} ${esc(h.name)}${h.estimated ? ' (estimated)' : ''}${h.working ? ' — working day' : ''}`).join('; ')}.` : 'No public holiday falls inside the window.'} Working weekdays: ${cal.raw.working_weekdays.map(x => WD[x - 1]).join(', ')}; call hours ${R.p2(cal.hours.start)}:00–${R.p2(cal.hours.end)}:00${cal.tz ? ' (' + esc(cal.tz) + ')' : ''}.</p>`;

  function perfPanel(C, now) {
    const S = APP.S, tz = C.cal.tz;
    const cur = C.eff.dials.map(R.dialRow);
    const all = cur.concat(S.past.dials);
    const thisM = (() => { const p = R.partsIn(now, tz); return `${p.y}-${R.p2(p.m)}`; })();
    const lastM = (() => { const p = R.partsIn(now, tz); return p.m === 1 ? `${p.y - 1}-12` : `${p.y}-${R.p2(p.m - 1)}`; })();
    const sets = [['This round so far', cur], ['This month', all.filter(r => R.monthKey(r, tz) === thisM)], ['Last month', all.filter(r => R.monthKey(r, tz) === lastM)], ['All loaded logs', all]];
    const P = sets.map(([l, rows]) => [l, R.perf(rows, tz)]);
    const row = (label, f, def) => `<tr><th title="${esc(def || '')}">${label}</th>${P.map(([, p]) => `<td class="num">${f(p)}</td>`).join('')}</tr>`;
    const kpi = `<table class="grid kpi"><thead><tr><th></th>${P.map(([l]) => `<th class="num">${l}</th>`).join('')}</tr></thead><tbody>
      ${row('Dials', p => p.dials, 'Box 3.0: one call to a household')}
      ${row('Completes', p => p.completes, 'Box 3.0: the dial on which the interview took place, 3 minutes or more')}
      ${row('Success rate', p => pct(p.success), 'Completes per dial')}
      ${row('Dials per complete', p => num(p.dpc, 1))}
      ${row('First-dial success', p => pct(p.first_rate), 'Completes on the first dial of a case, per first dial')}
      ${row('Enumerator-days', p => p.edays, 'Box 3.0: days with at least one dial')}
      ${row('Completes per enumerator-day', p => num(p.cpd, 1), 'Box 3.0')}
    </tbody></table>`;
    const hp = R.perf(all, tz);
    const lo = Math.min(C.cal.hours.start, ...hp.hours.map((h, i) => (h.dials ? i : 24))), hi = Math.max(C.cal.hours.end - 1, ...hp.hours.map((h, i) => (h.dials ? i : 0)));
    const hrs = []; for (let h = lo; h <= hi; h++) hrs.push(h);
    const chart = hourChart(hrs.map(h => ({ h, n: hp.hours[h].dials, ok: hp.hours[h].ok })));
    const tableH = `<table class="grid small"><thead><tr><th>Hour</th><th class="num">Dials</th><th class="num">Completes</th><th class="num">Success</th></tr></thead><tbody>${hrs.map(h => { const x = hp.hours[h]; return `<tr><td>${R.p2(h)}:00</td><td class="num">${x.dials}</td><td class="num">${x.ok}</td><td class="num">${x.dials >= 10 ? pct(x.ok / x.dials) : x.dials ? 'too few' : ''}</td></tr>`; }).join('')}</tbody></table>`;
    // the plan ahead
    const cal = C.cal, tk = todayKey(), open = C.list.filter(c => c.open);
    const ahead = {}; const addA = (k, f) => { ahead[k] = ahead[k] || { first: 0, cb: 0, redial: 0 }; ahead[k][f]++; };
    open.forEach(c => { if (!c.next.at) return; const k = R.partsIn(c.next.at, cal.tz).key; if (k < tk) return; addA(k, c.next.kind === 'callback' ? 'cb' : c.n ? 'redial' : 'first'); });
    const due = open.filter(c => c.next.due).length;
    const aheadRows = Object.keys(ahead).sort().slice(0, 12).map(k => `<tr><td>${dayLabel(k)}${cal.isWorking(k) ? '' : ' <span class="tag">non-working</span>'}</td><td class="num">${ahead[k].first}</td><td class="num">${ahead[k].redial}</td><td class="num">${ahead[k].cb}</td></tr>`).join('');
    const files = S.past.files;
    return `<div class="perf">
      <section><h3>My results</h3>${kpi}
        <p class="muted">Definitions from handbook Box 3.0. "This round so far" counts the calls logged in this session; the other columns add any earlier logs you load. ${files.length ? `Loaded: ${files.map(f => esc(f.name)).join(', ')}.` : 'No earlier logs loaded yet: use "Load earlier logs" above to compare with last month.'}</p></section>
      <section><h3>When my calls succeed</h3>
        <p class="muted">Share of dials started in each hour on which the interview took place, over all loaded logs. Hours with fewer than 10 dials are shown hatched: too few to judge. This is your own pattern. Across the programs, the handbook finds that dials later in the day succeed more often than those at midday (Section 3.5.1).</p>
        ${chart}<details><summary>Show as a table</summary>${tableH}</details></section>
      <section><h3>The plan ahead</h3>
        <p><b>${open.length}</b> household${open.length === 1 ? '' : 's'} still open · <b>${due}</b> due now · <b>${R.workingDaysLeft(cal, tk)}</b> working days left in the window.</p>
        ${aheadRows ? `<table class="grid small"><thead><tr><th>Day</th><th class="num">First dials</th><th class="num">Redials</th><th class="num">Callbacks</th></tr></thead><tbody>${aheadRows}</tbody></table>` : '<p class="muted">Nothing planned ahead.</p>'}
      </section></div>`;
  }
  function hourChart(rows) {
    const W = 640, H = 200, pl = 34, pb = 26, pt = 10, bw = (W - pl - 8) / Math.max(rows.length, 1);
    const y = v => pt + (H - pt - pb) * (1 - v);
    let bars = '';
    rows.forEach((r, i) => {
      const x = pl + i * bw + 3, rate = r.n ? r.ok / r.n : 0, few = r.n < 10;
      const top = y(rate), h = H - pb - top;
      if (r.n) bars += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${Math.max(h, 1).toFixed(1)}" rx="3" class="${few ? 'few' : 'bar'}"><title>${R.p2(r.h)}:00 — ${r.ok} completes of ${r.n} dials${few ? ' (too few to judge)' : ''}</title></rect>`;
      bars += `<text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${H - 9}" class="ax" text-anchor="middle">${r.h}</text>`;
      if (r.n) bars += `<text x="${(x + (bw - 6) / 2).toFixed(1)}" y="${(top - 3).toFixed(1)}" class="lab" text-anchor="middle">${r.n}</text>`;
    });
    const grid = [0, 0.25, 0.5, 0.75, 1].map(v => `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl - 4}" y="${y(v) + 4}" class="ax" text-anchor="end">${v * 100}%</text>`).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Success rate by hour of the day">
      <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch"/></pattern></defs>
      ${grid}${bars}<text x="${W - 4}" y="${pt + 2}" class="ax" text-anchor="end">bar label: dials</text></svg>`;
  }
  function logPanel(C) {
    const S = APP.S, chain = R.verifyChain(S.events, S.genesis);
    const ev = S.events.slice().reverse();
    const kindTxt = e => ({ dial: 'Call', correction: e.void ? 'Voided an entry' : 'Correction', action: R.ACTIONS[e.action] || e.action, contact_update: 'Phone number', export: 'Exported the log', session: e.what === 'started' ? 'Session started' : 'Assignment updated' }[e.type] || e.type);

      if (e.type === 'dial') return `${statusLabel(e.status)} · number ${e.phone_slot} · ${isoWhen(e.ts)}${e.end_ts ? ' – ' + hm(R.parseTS(e.end_ts)) : ''}${e.appointment_ts ? ' · callback ' + isoWhen(e.appointment_ts) : ''}${e.action ? ' · ' + (R.ACTIONS[e.action] || e.action) : ''}${e.note ? ' · “' + esc(e.note) + '”' : ''}`;

      if (e.type === 'contact_update') return `number ${e.slot}: ${esc(e.change)}${e.label ? ' (' + esc(e.label) + ')' : ''}`;

    return `<p class="${chain.ok ? 'okline' : 'badline'}">${chain.ok ? `Integrity check passed: all ${chain.n} events are unchanged and in order.` : `Integrity check failed at event ${chain.index + 1}: ${esc(chain.reason)}.`} Every entry records who logged it and when; corrections are added as new entries, never written over the old ones.</p>

      <div class="badges"><span class="st st-${c.state}">${stateLabel[c.state]}</span> <span class="tag">${esc(reasonText(h))}</span>${c.kind === 'replacement' ? ` <span class="tag">replaces ${esc(h.replaces)}</span>` : ''}${c.flags.switch_requested ? ' <span class="tag">switch asked</span>' : ''}</div>
      ${ruleName() !== 'keep_same' && RULE_WHY[ruleName()] ? `<details class="why"><summary>Why is this household with me?</summary><p class="muted small">${RULE_WHY[ruleName()]}</p></details>`

    return `<section class="start"><h1>Team leader view</h1>
      <p class="lead">The leader view (assignment files for each enumerator, importing their logs, the merged log, progress, attrition and risk lists) is built in Step 3.</p>

  function render() {

      case 'call': startCall(APP.sel, el.dataset.slot); break;
      case 'endcall': endCall(); break;
      case 'cancelcall': clearInterval(APP.timer); APP.call = null; render(); break;

      case 'cancelmanual': APP.manual = false; render(); break;
      case 'savemanual': saveCall(true); break;

      case 'cancelcorr': APP.correct = null; render(); break;

      case 'release': if (c) doAction(c, 'RELEASE'); break;
      case 'switch': if (c) doAction(c, 'SWITCH_REQUEST'); break;
      case 'remove': if (c) doAction(c, 'REMOVE_REQUEST'); break;
      case 'replace': if (c) activateReplacement(c); break;
      case 'contact': APP.contact = !APP.contact; render(); break;
      case 'cancelcontact': APP.contact = false; render(); break;
      case 'savecontact': saveContact(); break;
      case 'copy': { const t = el.dataset.txt; if (navigator.clipboard && t) navigator.clipboard.writeText(t).then(() => toast('Number copied.'), () => toast('Copy it by hand: ' + t, 'warn')); break; }

      case 'export': exportLog(); break;
      case 'dl': { const X = APP.exportPack, w = el.dataset.what;
        if (w === 'csv') download(X.base + '.csv', X.csv, 'text/csv');
        if (w === 'json') download(X.base + '.json', JSON.stringify(X.json, null, 1), 'application/json');

      case 'closemodal': APP.modal = null; render(); break;
      case 'unseal': tryPassphrase(); break;
      case 'modalalt': { const m = APP.modal; APP.modal = null; render(); if (m && m.onAlt) m.onAlt(); break; }

        const closeIt = () => { APP.S = null; APP.sel = null; APP.call = null; APP.unsaved = 0; APP.fileHandle = null; APP.loadWarnings = []; render(); };
        if (!APP.unsaved) { confirmModal('Close this session', 'Your session is saved. You can continue later by opening the saved session file.', { okLabel: 'Close session' }, closeIt); break; }
        confirmModal('Close this session', `${R.plural(APP.unsaved, 'change')} ${APP.unsaved === 1 ? 'is' : 'are'} not saved. Save your session first, or ${APP.unsaved === 1 ? 'it' : 'they'} will be lost.`,
          { okLabel: 'Save, then close', altLabel: 'Close without saving', onAlt: closeIt }, async () => { await saveSession(); if (!APP.unsaved) closeIt(); });
        break;
      }
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'f-assign' && t.files[0]) openAssignment(t.files[0]);
    else if (t.id === 'f-project' && t.files[0]) openProject(t.files[0]);

    else if (t.id === 'f-update' && t.files[0]) openAssignment(t.files[0]);

  document.addEventListener('input', e => {
    if (e.target.id === 'hh-search') { APP.q = e.target.value; const C = APP.C; const tbl = $('#hh-table'); if (tbl) { APP.tab = 'households'; render(); const s = $('#hh-search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } } }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act="open"]')) e.target.click();
    if (e.key === 'Escape' && APP.modal) { APP.modal = null; render(); }

  setInterval(() => { if (APP.S && !APP.call && !APP.manual && !APP.correct && !APP.contact && !APP.modal && !document.activeElement.matches('input,select,textarea')) render(); }, 60000);

  if (document.readyState !== 'loading') render();
})();

<script>/* RTM interview tool: the team leader view (Step 3). Prepare a round (household list, history, replacements,

   export the merged call log and the round's files, and read the attrition and operational analytics.
   Reads only files the leader opens; writes only files the leader saves or exports. */
(function () {
  'use strict';
  const R = window.RTM, L = window.LCORE, S = window.LSTATS, APP = window.APP;
  const sh = () => APP.shell;
  const esc = s => sh().esc(s);
  const $ = s => document.querySelector(s);
  const p2 = n => String(n).padStart(2, '0');
  const pc = (x, d) => (x === null || x === undefined || isNaN(x) ? '–' : (100 * x).toFixed(d === undefined ? 0 : d) + '%');
  const nm = (x, d) => (x === null || x === undefined || isNaN(x) ? '–' : (+x).toFixed(d || 0));
  const ci = w => (w ? `${pc(w.p)} <span class="muted small">(${pc(w.lo)}–${pc(w.hi)}, n ${w.n})</span>` : '<span class="muted">–</span>');
  const TZ_OF = { UZ: 'Asia/Tashkent', TJ: 'Asia/Dushanbe', KG: 'Asia/Bishkek', KZ: 'Asia/Almaty', PH: 'Asia/Manila', ID: 'Asia/Jakarta', UA: 'Europe/Kyiv',
    AM: 'Asia/Yerevan', GE: 'Asia/Tbilisi', SO: 'Africa/Mogadishu', MN: 'Asia/Ulaanbaatar' };
  const COUNTRIES = (window.RTM_HOLIDAYS && window.RTM_HOLIDAYS.meta && window.RTM_HOLIDAYS.meta.countries) || {};
  const RAMADAN = new Set(['UZ', 'TJ', 'KG', 'KZ', 'ID', 'SO']);
  const WDN = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const LV = window.LEAD = {};
  let st = null, cache = {};
  const ui = { tab: 'prepare', hhFilter: 'all', hhEnum: '', logEnum: '', logStatus: '', logQ: '', logMore: 0, ready: null, readyKind: '', passphrases: null, busy: '', moves: null, movesInclude: 'not_started', movesStale: false };

  const filesStale = () => { if (ui.ready) { ui.ready = null; ui.passphrases = null; ui.stale = true; } };
  const toast = (t, k) => sh().toast(t, k);

  // ---- the leader's own log: every action with who and when, hash-chained like the enumerators' logs ----
  function logEv(what, fields) {
    const prev = st.events.length ? st.events[st.events.length - 1].hash : st.genesis;
    const e = R.clean(Object.assign({ event_id: R.uuid(), type: 'leader', what, program: st.program, round: st.round }, fields || {},

  }

    st = {
      schema: L.SCHEMA.leader, leader: o.leader, program: o.program, country: o.country, round: o.round, started_at: R.localISO(R.now()),
      inputs: { households: null, replacements: null, history: [], manual: null }, mapping: {},
      cal: { window_start: '', window_end: '', working_weekdays: [1, 2, 3, 4, 5, 6], call_hours: { start: 9, end: 21 }, time_zone: TZ_OF[o.country] || '', dial_cap: null, day_list: null },
      holidayWorking: [], customHolidays: [], removedHolidays: [], ramadanOn: RAMADAN.has(o.country), breakFast: null,
      team: [], criteria: [], rule: { name: 'keep_same', rotation_share: null, seed: randomSeed(), order_by: 'psu', method: 'random' },
      spread: 0.5, margin: 0.15, policy: { active: true, triggers: ['REFUSAL_HARD', 'ALL_NUMBERS_DEAD'] }, protect: false,
      plan: null, generated: null, manifest: null, imports: [], resolutions: [], events: [], unsaved: 0,

  // ---- calendar from the settings: holidays from the bundled table, the leader's changes kept ----
  function calendar() {

    // the day list: the leader's number, else 1.5 × the planned first dials per day once the rule has been applied

    if (dl) out.day_list = dl;

        .forEach(h => hol.push({ date: h.date, name: h.name, estimated: !!h.estimated, working: st.holidayWorking.includes(h.date) }));
      st.customHolidays.filter(h => h.date >= c.window_start && h.date <= c.window_end && !hol.some(x => x.date === h.date))
        .forEach(h => hol.push({ date: h.date, name: h.name, estimated: false, working: st.holidayWorking.includes(h.date), added_by_leader: true }));

  }
  // Ramadan: the 30 days before Eid al-Fitr, from the same holiday table (Section 3.5.4), inside the window
  function ramadanDates() {
    const c = st.cal;
    if (!R.isDateKey(c.window_start) || !R.isDateKey(c.window_end)) return [];
    const out = new Set();
    R.bundledHolidays(st.country).filter(h => /fitr/i.test(h.name)).forEach(h => {
      for (let i = 1; i <= 30; i++) { const k = R.addDaysKey(h.date, -i); if (k >= c.window_start && k <= c.window_end) out.add(k); }
    });

  }

  // ---- derived inputs ----
  function derived() {
    if (cache.d) return cache.d;
    const d = {};
    d.hh = st.inputs.households ? L.parseHouseholds(st.inputs.households.text) : null;
    d.repl = st.inputs.replacements ? L.parseReplacements(st.inputs.replacements.text, d.hh ? d.hh.households : null) : null;
    d.histFiles = st.inputs.history.map(f => L.readHistoryFile(f.name, f.text));
    d.unknown = L.unknownCodes(d.histFiles);
    d.hist = L.buildHistory(d.histFiles.concat(exportHistory(d.histFiles)), { tz: st.cal.time_zone || null, mapping: st.mapping });
    d.round = d.hh && !d.hh.errors.length ? L.roundHouseholds(d.hh.households, d.repl && !d.repl.errors.length ? d.repl.lists : new Map(), d.hist, st.round) : null;
    d.avail = d.round && d.repl && !d.repl.errors.length ? L.availableReplacements(d.repl.lists, d.round.reserves, d.hh.households) : new Map();
    d.manualMap = null;
    if (st.inputs.manual) {
      const T = L.readTable(st.inputs.manual.text), hc = T.col('hhid'), ec = T.col('enumerator_id') || T.col('enumerator');
      d.manualMap = new Map(hc && ec ? T.rows.map(r => [String(r[hc]).trim(), String(r[ec]).trim()]) : []);
    }

  }
  // an enumerator's own export of an earlier round, opened as history, counts as that round's dials
  function exportHistory(files) {
    const out = [];
    files.filter(f => f.kind === 'export').forEach(f => {
      const rows = f.export.dials || [];
      const text = R.toCSV(rows.map(r => Object.fromEntries(R.CSV_COLS.map(c => [c, r[c] === undefined || r[c] === null ? '' : String(r[c])]))), R.CSV_COLS);
      out.push(L.readHistoryFile(f.name.replace(/\.json$/i, '.csv'), text));

  }
  function suggestFromHistory() {
    const d = derived(), H = d.hist;
    if (st.suggested) return;
    const lastR = H.rounds.length ? H.rounds[H.rounds.length - 1] : null;
    const lm = lastR !== null ? H.manifests.get(lastR) : null;
    if (lm && lm.calendar) {
      const c = lm.calendar;
      if (st.cal.dial_cap === null && Number.isInteger(c.dial_cap)) st.cal.dial_cap = c.dial_cap;
      if (c.call_hours) st.cal.call_hours = Object.assign({}, c.call_hours);
      if (Array.isArray(c.working_weekdays)) st.cal.working_weekdays = c.working_weekdays.slice();
      if (c.time_zone && !st.cal.time_zone) st.cal.time_zone = c.time_zone;
      if ((st.cal.day_list === null || st.cal.day_list === undefined) && Number.isInteger(c.day_list)) st.cal.day_list = c.day_list;
    }
    if (!st.team.length && lastR !== null) {
      const ids = new Set();
      if (lm) { (lm.enumerators || []).forEach(e => ids.add(e.enumerator_id)); (lm.away || []).forEach(e => ids.add(e)); }
      (H.dials.get(lastR) || []).forEach(x => { if (x.operator) ids.add(x.operator); });
      // last round's matching criteria and each enumerator's values carry over; the leader can change them
      const lmm = lm && lm.matching;
      const attrsOf = id => { const m = lmm && lmm.enumerators && lmm.enumerators[id]; return m ? Object.fromEntries(Object.entries(m).map(([k, v]) => [k, (v || []).join(' ')])) : {}; };
      st.team = [...ids].sort().map(id => ({ id, available: true, share: 1, attrs: attrsOf(id) }));

  // ---- applying the rule, the load check, and the files ----
  const ruleObj = () => R.clean({ name: st.rule.name, rotation_share: st.rule.name === 'keep_same' ? st.rule.rotation_share : undefined, seed: st.rule.seed,
    order_by: /split|share/.test(st.rule.name) ? st.rule.order_by : undefined, method: st.rule.name === 'share_of_total' ? st.rule.method : undefined });
  function prepErrors() {
    const d = derived(), c = st.cal, e = [];

    else if (d.hh.errors.length) e.push('Fix the household list first (step 1).');
    if (d.repl && d.repl.errors.length) e.push('Fix the replacement list, or remove it (step 3).');

  function loadProject(o, name) {
    if (!o || o.schema !== L.SCHEMA.leader) return toast(`${name} is not a saved leader session.`, 'warn');
    const copy = Object.assign({}, o); delete copy.checksum;
    if (R.sha256(R.canon(copy)) !== o.checksum) return toast(`${name} was changed or damaged after it was saved (checksum). It was not opened.`, 'warn');
    const chain = R.verifyChain(o.events || [], o.chain_genesis);
    st = { schema: o.schema, leader: o.saved_by, program: o.program, country: o.country, round: o.round, started_at: o.started_at, genesis: o.chain_genesis,
      inputs: o.inputs, plan: null, generated: o.generated, manifest: o.manifest, imports: o.imports || [], resolutions: o.resolutions || [], events: o.events || [], unsaved: 0 };
    Object.assign(st, o.settings);
    st.risk = st.risk || { dropout: { kind: 'pooled' }, return: { kind: 'pooled' } };
    st.criteria = Array.isArray(st.criteria) ? st.criteria : [];
    (st.team || []).forEach(t => { t.attrs = t.attrs || {}; });
    if (st.cal && st.cal.day_list === undefined) st.cal.day_list = null;
    if (o.plan) {
      invalidate();
      const inp = inputFor();
      const sums = new Map(inp.households.map(h => [h.hhid, L.summaryOf(inp.hist, h.hhid, st.round, inp.tz)]));
      const out = new Map(o.plan.out);
      st.plan = { out, sums, notes: o.plan.notes, warnings: o.plan.warnings, moves: o.plan.moves, at: o.plan.at };
      const P = L.plan(inp, out, sums, inp.hist);
      Object.assign(st.plan, { plans: P.plans, best: P.best, firstDays: P.firstDays, workingDays: P.workingDays });
    }
    invalidate();
    ui.tab = st.manifest ? 'progress' : 'prepare';
    toast(`Leader session restored: ${st.program} round ${st.round}, ${R.plural(st.imports.length, 'imported file')}${chain.ok ? '' : ', but its log fails the integrity check'}.`, chain.ok ? 'ok' : 'warn');
